name: CI

on:
  push:
    branches:
      - main
      - 'feat/**'
      - 'fix/**'
      - 'docs/**'
      - 'style/**'
      - 'refactor/**'
      - 'perf/**'
      - 'test/**'
      - 'build/**'
      - 'ci/**'
      - 'chore/**'
      - 'revert/**'
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  foundation:
    name: 📚 Foundation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - run: python3 scripts/check_foundation.py
      - run: python3 -m unittest discover -s scripts/tests -v

  openspec:
    name: 📝 OpenSpec
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
      - run: npx --yes @fission-ai/openspec@1.3.0 validate --all --strict

  status:
    name: ✅ CI Status
    if: always()
    needs: [foundation, openspec]
    runs-on: ubuntu-latest
    env:
      FOUNDATION_RESULT: ${{ needs.foundation.result }}
      OPENSPEC_RESULT: ${{ needs.openspec.result }}
    steps:
      - name: Require actual successful dependencies
        run: |
          test "$FOUNDATION_RESULT" = success
          test "$OPENSPEC_RESULT" = success
